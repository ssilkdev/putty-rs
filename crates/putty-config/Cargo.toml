[package]
name = "putty-config"
version = "0.85.0"
edition = "2021"
authors = ["PuTTY Rust Team"]
description = "PuTTY session configuration and Windows Registry / file persistence with FIPS mode"

[dependencies]
putty-fips = { path = "../putty-fips" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
