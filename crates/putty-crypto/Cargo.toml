[package]
name = "putty-crypto"
version = "0.85.0"
edition = "2021"
authors = ["PuTTY Rust Team"]
description = "Cryptographic algorithms, key generation, and PPK format parsing with FIPS 140-3 support"

[dependencies]
putty-fips = { path = "../putty-fips" }
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2.6"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hmac = "0.12"
aes = "0.8"
ctr = "0.9"
cbc = "0.1"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
p256 = { version = "0.13", features = ["ecdh", "ecdsa", "arithmetic"] }
p384 = { version = "0.13", features = ["ecdh", "ecdsa", "arithmetic"] }
rsa = { version = "0.9", features = ["sha2"] }
num-bigint = "0.4"
rand = "0.8"
rand_core = "0.6"
base64 = "0.22"
argon2 = "0.5"
thiserror = "1.0"
